name: MERIDIAN CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Job 1: Install dependencies (cached)
  # ─────────────────────────────────────────────────────────────────
  dependency-install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

  # ─────────────────────────────────────────────────────────────────
  # Job 2: TypeScript type-check
  # ─────────────────────────────────────────────────────────────────
  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    needs: dependency-install
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Run TypeScript type check
        run: npx tsc --noEmit

  # ─────────────────────────────────────────────────────────────────
  # Job 3: ESLint
  # ─────────────────────────────────────────────────────────────────
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    needs: dependency-install
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Run ESLint on backend (zero warnings tolerated)
        run: npm run lint

  # ─────────────────────────────────────────────────────────────────
  # Job 4: Database schema validation (PGlite, no external DB needed)
  # ─────────────────────────────────────────────────────────────────
  db-schema-validate:
    name: DB Schema Validation
    runs-on: ubuntu-latest
    needs: dependency-install
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Validate DB schema with PGlite (no external DB required)
        run: npx tsx scripts/verify_disposable_db.ts
        env:
          NODE_ENV: test

  # ─────────────────────────────────────────────────────────────────
  # Job 5: Backend API, Concurrency & Transaction Affinity Tests
  # ─────────────────────────────────────────────────────────────────
  backend-tests:
    name: Backend API, Concurrency & Transaction Affinity Tests (Native PostgreSQL 16 & PGlite)
    runs-on: ubuntu-latest
    needs: [type-check, db-schema-validate]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: meridian
          POSTGRES_PASSWORD: meridian_ci_password
          POSTGRES_DB: meridian_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Initialize Native PostgreSQL 16 database
        run: npx tsx scripts/init_db.ts
        env:
          DATABASE_URL: postgresql://meridian:meridian_ci_password@localhost:5432/meridian_test
          NODE_ENV: test

      - name: Run transaction connection affinity test (Native PostgreSQL 16)
        run: npx tsx tests/test_transaction_affinity.ts
        env:
          DATABASE_URL: postgresql://meridian:meridian_ci_password@localhost:5432/meridian_test
          NODE_ENV: test

      - name: Run backend API tests (Native PostgreSQL 16)
        run: npx tsx tests/api.test.ts
        env:
          DATABASE_URL: postgresql://meridian:meridian_ci_password@localhost:5432/meridian_test
          NODE_ENV: test
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-secret-do-not-use-in-production' }}

      - name: Run multi-connection concurrency & financial parity stress test (Native PostgreSQL 16)
        run: npx tsx tests/concurrency.test.ts
        env:
          DATABASE_URL: postgresql://meridian:meridian_ci_password@localhost:5432/meridian_test
          NODE_ENV: test

      - name: Run backend API & concurrency verification on embedded PGlite
        run: |
          npx tsx scripts/init_db.ts
          npx tsx tests/test_transaction_affinity.ts
          npx tsx tests/api.test.ts
          npx tsx tests/concurrency.test.ts
        env:
          DATABASE_URL: ''
          USE_PGLITE: 'true'
          NODE_ENV: test
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-secret-do-not-use-in-production' }}

  # ─────────────────────────────────────────────────────────────────
  # Job 6: Frontend build
  # ─────────────────────────────────────────────────────────────────
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: [type-check]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Build frontend bundle
        run: npx tsx scripts/build_frontend.ts

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/public/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────
  # Job 7: C++ engine build, tests, and IPC bridge verification
  # ─────────────────────────────────────────────────────────────────
  cpp-build-and-test:
    name: C++ Engine Build, Test & IPC Bridge
    runs-on: ubuntu-latest
    needs: [dependency-install]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y g++ cmake

      - name: Verify g++ version (need C++20 support)
        run: g++ --version

      - name: Build C++ order book test binary
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -pthread \
            -Iengine/include \
            engine/src/order_book.cpp \
            engine/tests/test_order_book.cpp \
            -o test_ob

      - name: Run C++ order book tests
        run: ./test_ob

      - name: Build and execute with AddressSanitizer and UndefinedBehaviorSanitizer (blocking)
        run: |
          g++ -std=c++20 -O1 -fsanitize=address,undefined -fno-omit-frame-pointer -pthread \
            -Iengine/include \
            engine/src/order_book.cpp \
            engine/tests/test_order_book.cpp \
            -o test_ob_asan
          ./test_ob_asan

      - name: Build standalone C++ engine executable
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -pthread \
            -Iengine/include \
            engine/src/order_book.cpp \
            engine/src/main.cpp \
            -o engine/meridian_engine

      - name: Smoke test standalone engine CLI protocol
        run: |
          printf "SNAPSHOT 1\nQUIT\n" | ./engine/meridian_engine

      - name: Run C++ IPC bridge integration test against live binary
        run: npx tsx tests/cpp_bridge.test.ts

  # ─────────────────────────────────────────────────────────────────
  # Job 8: Secret scanning
  # ─────────────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for TruffleHog

      - name: TruffleHog full-history secret scan
        uses: trufflesecurity/trufflehog@v3.88.15
        with:
          path: ./
          extra_args: --only-verified

      - name: Grep for common hardcoded secrets (always runs)
        run: |
          echo "Scanning for hardcoded secrets patterns..."
          FOUND=0

          # Check for hardcoded JWT secrets
          if grep -rn --include="*.ts" --include="*.js" --include="*.json" \
            -E "(jwt_secret|JWT_SECRET)\s*[:=]\s*['\"][^'\"]{8,}['\"]" \
            --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=public --exclude-dir=dist \
            --exclude="bundle.js*" --exclude="*.test.ts" .; then
            echo "WARNING: Possible hardcoded JWT secret found"
            FOUND=1
          fi

          # Check for hardcoded passwords
          if grep -rn --include="*.ts" --include="*.js" \
            -E "password\s*[:=]\s*['\"][^'\"]{6,}['\"]" \
            --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=public --exclude-dir=dist \
            --exclude="bundle.js*" --exclude="*.test.ts" --exclude="*.example" .; then
            echo "WARNING: Possible hardcoded password found"
            FOUND=1
          fi

          if [ $FOUND -eq 1 ]; then
            echo "Secret scan found potential issues. Review above output."
            exit 1
          else
            echo "No hardcoded secrets found."
          fi

  # ─────────────────────────────────────────────────────────────────
  # Job 9: npm audit for vulnerabilities
  # ─────────────────────────────────────────────────────────────────
  npm-audit:
    name: npm Audit
    runs-on: ubuntu-latest
    needs: dependency-install
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Run npm audit (high severity threshold)
        run: npm audit --audit-level=high

  # ─────────────────────────────────────────────────────────────────
  # Final gate: all jobs must pass
  # ─────────────────────────────────────────────────────────────────
  ci-gate:
    name: CI Gate (All Checks Pass)
    runs-on: ubuntu-latest
    needs:
      - dependency-install
      - type-check
      - lint
      - db-schema-validate
      - backend-tests
      - frontend-build
      - cpp-build-and-test
      - secret-scan
      - npm-audit
    if: always()
    steps:
      - name: Verify all mandatory CI jobs succeeded
        run: |
          RESULTS="${{ join(needs.*.result, ' ') }}"
          echo "Job results: $RESULTS"
          FAILED=0
          for res in $RESULTS; do
            if [ "$res" != "success" ]; then
              echo "Error: Job result was '$res' (expected 'success')"
              FAILED=1
            fi
          done
          if [ $FAILED -ne 0 ]; then
            echo "CI Gate Failed: One or more prerequisite jobs did not succeed."
            exit 1
          fi
          echo "All CI checks succeeded!"
