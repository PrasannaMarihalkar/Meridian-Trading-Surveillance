version: '3.8'

services:
  meridian-db:
    image: postgres:16-alpine
    container_name: meridian_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meridian_db}
      POSTGRES_USER: ${POSTGRES_USER:-meridian_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD environment variable is required}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/sql/02_views_triggers.sql:/docker-entrypoint-initdb.d/02_views_triggers.sql
      - ./database/sql/03_seed_data.sql:/docker-entrypoint-initdb.d/03_seed_data.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meridian_user} -d ${POSTGRES_DB:-meridian_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  meridian-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meridian_app
    restart: always
    depends_on:
      meridian-db:
        condition: service_healthy
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-meridian_user}:${POSTGRES_PASSWORD}@meridian-db:5432/${POSTGRES_DB:-meridian_db}
      JWT_SECRET: ${JWT_SECRET:?Error: JWT_SECRET environment variable is required}
    ports:
      - "${PORT:-4000}:4000"

volumes:
  pgdata:
